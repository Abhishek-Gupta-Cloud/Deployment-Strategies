# Production Service (initially points to blue)
apiVersion: v1
kind: Service
metadata:
  name: myapp-service
  namespace: blue-green-demo
  labels:
    app: myapp
spec:
  type: LoadBalancer  # Change to NodePort or ClusterIP as needed
  selector:
    app: myapp
    version: blue  # This selector determines which deployment receives traffic
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    name: http